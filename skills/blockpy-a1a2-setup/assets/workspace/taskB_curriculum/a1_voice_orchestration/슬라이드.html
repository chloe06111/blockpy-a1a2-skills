{html:`
  <span class="tag explain">EXPLAIN · 설명 (25분) — 1/3</span>

/* 4 — Explain: LLM 분해 + JSON */
{html:`
  <span class="tag explain">EXPLAIN · 설명 (25분) — 2/3</span>
  <h2>오케스트레이터: 자연어 → JSON 계획</h2>
  <pre><span class="c"># LLM에게 "JSON 배열만 출력하라"고 지시</span>
<span class="k">raw</span> = llm.complete(messages=[...], system=ORCHESTRATOR_SYSTEM)
<span class="c"># 응답에서 [ ... ] 부분만 잘라 파싱</span>
start = raw.index(<span class="s">"["</span>); end = raw.rindex(<span class="s">"]"</span>) + 1
plan = json.loads(raw[start:end])
<span class="c"># list[dict]이고 비어있지 않으면 채택, 아니면 폴백</span>
return plan <span class="k">if</span> 유효 <span class="k">else</span> _fallback_plan(command)</pre>
  <div class="safe"><b>결정적 폴백:</b> mock이거나 JSON 파싱 실패 시 <code>_fallback_plan</code>(감지→분류→픽앤플레이스→복귀)으로 항상 안전하게 동작.</div>
`,
notes:`
  <h4>강사 대본</h4>
  <p>"사람 말은 흐물흐물해요. 기계는 딱 정해진 구조가 필요하죠. 그 ‘약속된 형식’이 <code>{action,target,desc}</code> JSON입니다."</p>
  <h4>짚을 포인트</h4>
  <ul><li><code>try/except (ValueError, json.JSONDecodeError)</code> 로 감싸 파싱 실패해도 죽지 않고 폴백으로 간다.</li>
  <li>mock LLM은 비-JSON을 줄 수 있어, 폴백 덕분에 수업이 항상 끝까지 돈다.</li></ul>
  <h4>예상 Q&A</h4>
  <p class="qa">Q. LLM이 매번 다르면 위험하지 않나요? → 그래서 다음 슬라이드의 ‘안전 게이트’가 있습니다.</p>
  <p class="qa">Q. index/rindex가 뭐죠? → 첫 '['와 마지막 ']' 위치를 찾아 그 사이만 잘라냅니다.</p>
`},

/* 5 — Explain: 안전 게이트 */
{html:`
  <span class="tag explain">EXPLAIN · 설명 (25분) — 3/3</span>
  <h2>안전 게이트 — 사람이 승인해야만 실행 (SFR-002)</h2>
  <pre><span class="k">def</span> review_plan(plan, approver=None):
    <span class="c"># 계획을 번호 매겨 사람에게 보여줌</span>
    <span class="k">for</span> i, step <span class="k">in</span> enumerate(plan, 1):
        print(f<span class="s">"{i}. ({step['action']}) {step['desc']}"</span>)
    <span class="k">if</span> approver <span class="k">is</span> None:
        <span class="k">return</span> True   <span class="c"># mock/무인: 자동 승인</span>
    <span class="k">return</span> bool(approver(plan))  <span class="c"># 실제: 사람이 y/n</span></pre>
  <div class="safe"><b>3중 안전:</b> ① 사람 승인 게이트 → ② 이동 직전 <code>check_move</code> 검사 → ③ 컨트롤러가 작업영역으로 다시 클램프.</div>
`,
notes:`
  <h4>강사 대본</h4>
  <p>"공장에서 로봇이 사람이 안 본 계획을 바로 실행하면? 사고죠. 그래서 산업 현장은 ‘사람 승인’을 반드시 끼워 넣습니다."</p>
  <h4>시연</h4>
  <ul><li><code>approver</code> 에 input 기반 함수를 넣어 ‘n’으로 거부 → "아무 동작도 실행하지 않습니다" 출력 확인.</li></ul>
  <h4>예상 Q&A</h4>
  <p class="qa">Q. check_move가 막아주면 게이트는 왜 또 필요? → 게이트는 ‘계획 전체’를, check_move는 ‘개별 좌표’를 막습니다. 계층이 다릅니다.</p>
`},

/* ===== 렌더링 & 네비게이션 ===== */
const stage=document.getElementById('stage');
const notesEl=document.getElementById('notes');
let idx=0;
SLIDES.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide'+(i===0?' active':'');
  d.innerHTML=s.html+'<div class="hint">N: 발표자 노트</div>';
  stage.appendChild(d);
});
const slideEls=[...document.querySelectorAll('.slide')];
document.getElementById('pagetot').textContent=SLIDES.length;

function render(){
  slideEls.forEach((el,i)=>el.classList.toggle('active',i===idx));
  document.getElementById('pageno').textContent=idx+1;
  document.getElementById('bar').style.width=((idx+1)/SLIDES.length*100)+'%';
  notesEl.innerHTML=SLIDES[idx].notes||'<p>(노트 없음)</p>';
}
function go(n){ idx=Math.max(0,Math.min(SLIDES.length-1,n)); render(); }

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){go(idx+1);e.preventDefault();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(idx-1);e.preventDefault();}
  else if(e.key==='Home'){go(0);}
  else if(e.key==='End'){go(SLIDES.length-1);}
  else if(e.key==='n'||e.key==='N'){notesEl.classList.toggle('show');}
});
/* 클릭/터치 네비: 화면 좌우 절반 */
document.addEventListener('click',e=>{
  if(e.target.closest('#notes')) return;
  if(e.clientX < window.innerWidth*0.4) go(idx-1);
  else if(e.clientX > window.innerWidth*0.6) go(idx+1);
});
render();
</script>
